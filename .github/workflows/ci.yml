name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      # gotestsum runs go test and also writes the results as JUnit XML, which Codecov's test analytics reads.
      # bash on every system, so Windows passes the arguments through as written.
      - name: Test
        shell: bash
        run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go build -v ./cmd/artifact-helper
      # Every system uploads, flagged by system: some code runs on one system only, such as the Windows
      # console check, and Codecov merges the uploads. A failed upload, such as during a Codecov outage, does
      # not fail the required test check.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          flags: ${{ matrix.os }}
      # Test results come from every system, flagged by system, and upload even when tests fail, which is
      # when they matter.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true
          flags: ${{ matrix.os }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh hooks/session-start .github/scripts/plugin-files.sh
          shellcheck .github/scripts/check-pr-title-priority.sh .github/scripts/check-commit-types.sh
      - name: Commit types agree
        run: .github/scripts/check-commit-types.sh
