[tools]
go = "1.27"
golangci-lint = "latest"
lefthook = "latest"

[vars]
version_flag = '-X github.com/tyrantkhan/artifact-helper/internal/cli.Version='
git_version = 'git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev'

[tasks.setup]
description = "Install the tools above and the git hooks"
run = ["mise install", "lefthook install"]

[tasks.build]
description = "Build bin/artifact-helper, versioned from git"
run = 'go build -ldflags "{{vars.version_flag}}$({{vars.git_version}})" -o bin/artifact-helper ./cmd/artifact-helper'

# Not go install: that puts a dev build on PATH, where it shadows the released one.
[tasks.dev]
description = "Build this checkout and run it with the arguments after --, installing nothing"
depends = ["build"]
run = "./bin/artifact-helper"

[tasks.test]
description = "Run the tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.clean]
description = "Remove the build output"
run = "rm -rf bin"
