[tools]
go = "1.27"
golangci-lint = "latest"
lefthook = "latest"

[vars]
ldflags = '-X github.com/tyrantkhan/claude-artifact-helper/internal/cli.Version=$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)'

[tasks.setup]
description = "Install the tools above and the git hooks"
run = ["mise install", "lefthook install"]

[tasks.build]
description = "Build bin/claude-artifact-helper, versioned from git"
run = 'go build -ldflags "{{vars.ldflags}}" -o bin/claude-artifact-helper ./cmd/claude-artifact-helper'

[tasks.install]
description = "Install claude-artifact-helper into GOPATH/bin, versioned from git"
run = 'go install -ldflags "{{vars.ldflags}}" ./cmd/claude-artifact-helper'

[tasks.test]
description = "Run the tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.clean]
description = "Remove the build output"
run = "rm -rf bin"
